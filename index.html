<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Living Epistles Ministries — Studio Generator (7 Layouts)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap');

  :root {
    --plum: #2A1040;
    --gold: #C9A96E;
    --violet: #7B5EA7;
    --violet-soft: #9E7AB5;
    --rose: #D4A0B5;
    --parchment: #FAF5EE;
    --cream: #E8D5B7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1e1326;
    color: var(--parchment);
    font-family: 'Lato', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* SIDEBAR CONTROLS */
  .controls-sidebar {
    width: 380px;
    background: #231530;
    border-right: 1px solid rgba(201, 169, 110, 0.3);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }

  .sidebar-header {
    border-bottom: 1px solid var(--gold);
    padding-bottom: 12px;
    margin-bottom: 8px;
  }

  .sidebar-header h2 {
    font-family: 'Cormorant Garamond', serif;
    color: var(--gold);
    font-size: 22px;
    font-weight: 600;
  }

  .sidebar-header p {
    font-size: 11px;
    color: var(--violet-soft);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--rose);
    font-weight: 700;
  }

  input, textarea, select {
    background: #180d21;
    border: 1px solid rgba(201, 169, 110, 0.4);
    color: var(--parchment);
    padding: 10px 12px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--gold);
  }

  textarea {
    resize: vertical;
    min-height: 80px;
    line-height: 1.5;
  }

  .export-btn {
    background: var(--gold);
    color: var(--plum);
    border: none;
    padding: 14px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.2s ease;
  }

  .export-btn:hover {
    background: #d8b87e;
  }

  /* WORKSPACE PREVIEW */
  .preview-workspace {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #120919;
    padding: 40px;
    overflow: auto;
  }

  /* CANVAS BASE */
  #graphic-canvas {
    width: 540px;
    height: 540px; /* Default Feed Square 1:1 */
    background: var(--plum);
    position: relative;
    padding: 45px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
    overflow: hidden;
  }

  /* CANVAS INTERNAL STYLES */
  .canvas-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(201, 169, 110, 0.4);
    padding-bottom: 12px;
  }

  .brand-sub {
    font-family: 'Lato', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--rose);
    text-transform: uppercase;
  }

  .canvas-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    padding: 15px 0;
  }

  .scripture-ref {
    font-family: 'Lato', sans-serif;
    font-size: 11px;
    letter-spacing: 2.5px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 700;
  }

  .scripture-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    line-height: 1.4;
    color: var(--parchment);
    margin-bottom: 16px;
    white-space: pre-wrap;
  }

  .declaration-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-style: italic;
    color: var(--cream);
    white-space: pre-wrap;
  }

  .canvas-footer {
    border-top: 1px solid rgba(201, 169, 110, 0.4);
    padding-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: var(--rose);
    letter-spacing: 1.5px;
  }

  /* -------------------------------------------------------------
     DIMENSION RATIOS
  ------------------------------------------------------------- */
  .ratio-story { width: 405px !important; height: 720px !important; }

  /* -------------------------------------------------------------
     THEME 1: PLUM CENTERED (CLASSIC DEEP PLUM)
  ------------------------------------------------------------- */
  .theme-plum {
    background: var(--plum) !important;
    color: var(--parchment) !important;
  }

  /* -------------------------------------------------------------
     THEME 2: PARCHMENT LIGHT (ELEGANT IVORY & VIOLET)
  ------------------------------------------------------------- */
  .theme-parchment {
    background: var(--parchment) !important;
    color: var(--plum) !important;
  }
  .theme-parchment .scripture-text { color: var(--plum) !important; }
  .theme-parchment .declaration-text { color: var(--violet) !important; }
  .theme-parchment .brand-sub, 
  .theme-parchment .canvas-footer { color: var(--violet-soft) !important; }

  /* -------------------------------------------------------------
     THEME 3: ROYAL VIOLET (SOFT VIOLET ACCENT)
  ------------------------------------------------------------- */
  .theme-violet {
    background: #3A1958 !important;
    color: var(--parchment) !important;
  }
  .theme-violet .scripture-ref { color: var(--cream) !important; }
  .theme-violet .declaration-text { color: var(--rose) !important; }

  /* -------------------------------------------------------------
     THEME 4: GOLD BORDERED (GOLD ACCENT FRAME)
  ------------------------------------------------------------- */
  .theme-gold-bordered {
    background: var(--plum) !important;
    border: 3px solid var(--gold) !important;
  }
  .theme-gold-bordered .canvas-header { border-bottom-color: var(--gold) !important; }
  .theme-gold-bordered .canvas-footer { border-top-color: var(--gold) !important; }

  /* -------------------------------------------------------------
     THEME 5: MODERN MINIMALIST (LEFT ALIGNED TEXT)
  ------------------------------------------------------------- */
  .theme-minimalist .canvas-body {
    text-align: left !important;
  }
  .theme-minimalist .scripture-text {
    border-left: 3px solid var(--gold);
    padding-left: 14px;
  }

  /* -------------------------------------------------------------
     THEME 6: DEEP NOIR (HIGH CONTRAST DARK PLUM)
  ------------------------------------------------------------- */
  .theme-noir {
    background: #180926 !important;
    color: var(--cream) !important;
  }
  .theme-noir .scripture-text { color: #FFFFFF !important; }
  .theme-noir .declaration-text { color: var(--gold) !important; }

  /* -------------------------------------------------------------
     THEME 7: PARCHMENT BORDERED (LIGHT FRAME)
  ------------------------------------------------------------- */
  .theme-parchment-bordered {
    background: var(--parchment) !important;
    color: var(--plum) !important;
    border: 3px solid var(--violet) !important;
  }
  .theme-parchment-bordered .scripture-text { color: var(--plum) !important; }
  .theme-parchment-bordered .declaration-text { color: var(--violet) !important; }
  .theme-parchment-bordered .brand-sub, 
  .theme-parchment-bordered .canvas-footer { color: var(--violet-soft) !important; }
</style>
</head>
<body>

<div class="controls-sidebar">
  <div class="sidebar-header">
    <h2>Living Epistles Studio</h2>
    <p>Graphic Generator — Full 7 Themes</p>
  </div>

  <div class="form-group">
    <label>Output Format & Layout Theme</label>
    <select id="layoutSelect" onchange="updateLayout()">
      <optgroup label="Feed Posts (1080x1080 Square)">
        <option value="post-1-plum">Post 1: Deep Plum Centered</option>
        <option value="post-2-parchment">Post 2: Ivory Parchment Light</option>
        <option value="post-3-violet">Post 3: Royal Violet Accent</option>
        <option value="post-4-goldborder">Post 4: Gold Bordered Frame</option>
        <option value="post-5-minimalist">Post 5: Modern Left-Aligned</option>
        <option value="post-6-noir">Post 6: Deep Dark Noir</option>
        <option value="post-7-parchmentborder">Post 7: Parchment Violet Frame</option>
      </optgroup>
      <optgroup label="Story Posts (1080x1920 Vertical)">
        <option value="story-1-plum">Story 1: Deep Plum Centered</option>
        <option value="story-2-parchment">Story 2: Ivory Parchment Light</option>
        <option value="story-3-violet">Story 3: Royal Violet Accent</option>
        <option value="story-4-goldborder">Story 4: Gold Bordered Frame</option>
        <option value="story-5-minimalist">Story 5: Modern Left-Aligned</option>
        <option value="story-6-noir">Story 6: Deep Dark Noir</option>
        <option value="story-7-parchmentborder">Story 7: Parchment Violet Frame</option>
      </optgroup>
    </select>
  </div>

  <div class="form-group">
    <label>Scripture Reference</label>
    <input type="text" id="refInput" value="PROVERBS 31:25 · NIV" oninput="renderCanvas()"/>
  </div>

  <div class="form-group">
    <label>Scripture Text (Preserve Line Breaks)</label>
    <textarea id="scriptureInput" oninput="renderCanvas()">"She is clothed
with strength and dignity;
she can laugh at the days to come."</textarea>
  </div>

  <div class="form-group">
    <label>Declaration / Reflection</label>
    <textarea id="declarationInput" oninput="renderCanvas()">"I am clothed in strength. I am a living epistle."</textarea>
  </div>

  <button class="export-btn" onclick="exportPNG()">Export High-Res PNG</button>
</div>

<div class="preview-workspace">
  <div id="graphic-canvas" class="theme-plum">
    <div class="canvas-header">
      <span class="brand-sub">Living Epistles</span>
      <span class="brand-sub">✦</span>
    </div>
    
    <div class="canvas-body">
      <div class="scripture-ref" id="canvasRef">PROVERBS 31:25 · NIV</div>
      <div class="scripture-text" id="canvasScripture">"She is clothed
with strength and dignity;
she can laugh at the days to come."</div>
      <div class="declaration-text" id="canvasDeclaration">"I am clothed in strength. I am a living epistle."</div>
    </div>

    <div class="canvas-footer">
      <span>LIVING-EPISTLES.ORG</span>
      <span>Keep writing. Keep rising. ✦</span>
    </div>
  </div>
</div>

<script>
  function renderCanvas() {
    document.getElementById('canvasRef').innerText = document.getElementById('refInput').value;
    document.getElementById('canvasScripture').innerText = document.getElementById('scriptureInput').value;
    document.getElementById('canvasDeclaration').innerText = document.getElementById('declarationInput').value;
  }

  function updateLayout() {
    const canvas = document.getElementById('graphic-canvas');
    const layout = document.getElementById('layoutSelect').value;

    // Reset base classes
    canvas.className = '';

    // Apply aspect ratio
    if (layout.startsWith('story')) {
      canvas.classList.add('ratio-story');
    }

    // Apply specific layout theme
    if (layout.includes('plum')) {
      canvas.classList.add('theme-plum');
    } else if (layout.includes('parchmentborder')) {
      canvas.classList.add('theme-parchment-bordered');
    } else if (layout.includes('parchment')) {
      canvas.classList.add('theme-parchment');
    } else if (layout.includes('violet')) {
      canvas.classList.add('theme-violet');
    } else if (layout.includes('goldborder')) {
      canvas.classList.add('theme-gold-bordered');
    } else if (layout.includes('minimalist')) {
      canvas.classList.add('theme-minimalist', 'theme-plum');
    } else if (layout.includes('noir')) {
      canvas.classList.add('theme-noir');
    }
  }

  function exportPNG() {
    const canvasElement = document.getElementById('graphic-canvas');
    const ref = document.getElementById('refInput').value.replace(/[^a-zA-Z0-9]/g, '-');
    const layout = document.getElementById('layoutSelect').value;

    html2canvas(canvasElement, {
      scale: 3, // High-res output (3x canvas resolution)
      useCORS: true
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = `${layout}_${ref}_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }
</script>

</body>
</html>
